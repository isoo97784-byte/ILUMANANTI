<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILUMINANTI - Leenjii Online</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #172a52;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .hero {
      background: #3157a4;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    section {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0002;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 7px;
      background: #172a52;
      color: white;
      font-size: 16px;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>ILUMINANTI</h1>
  <p>Leenjii Online Afaan Oromoo</p>
</header>

<div class="hero">
  <h2>Baga Nagaan Dhuftan!</h2>
  <p>Baradhu • Dandeettii kee guddifachuu • Gara fuulduraatti tarkaanfadhi</p>
</div>

<section>
  <div class="box">
    <h2>📝 Galmaa'i</h2>

    <input id="email" type="email" placeholder="Email kee">
    <input id="password" type="password" placeholder="Password kee">

    <button id="signup">Account Uumi</button>
    <button id="login">Seeni</button>

    <p id="message"></p>
  </div>
</section>

<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  const firebaseConfig = {
    apiKey: "AIzaSyC6HhJdYVGkMjmhYTiqjUzYXw8cfXfv7As",
    authDomain: "iluminanti-42c47.firebaseapp.com",
    projectId: "iluminanti-42c47",
    storageBucket: "iluminanti-42c47.firebasestorage.app",
    messagingSenderId: "487766650464",
    appId: "1:487766650464:web:af9aaf5bcb5bb17e679d05"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const message = document.getElementById("message");


  document.getElementById("signup").onclick = async () => {

    try {
      await createUserWithEmailAndPassword(
        auth,
        email.value,
        password.value
      );

      message.textContent = "✅ Account kee uumameera!";

    } catch (error) {
      message.textContent = "❌ " + error.message;
    }
  };


  document.getElementById("login").onclick = async () => {

    try {
      await signInWithEmailAndPassword(
        auth,
        email.value,
        password.value
      );
window.location.href = "dashboard.html";
      

    } catch (error) {
      message.textContent = "❌ Email ykn password sirrii miti.";
    }
  };

</script>

</body>
</html>
