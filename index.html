<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ILUMINANTI - Leenjii Online</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#172a52;
  color:white;
  padding:22px 15px;
  text-align:center;
}

.hero{
  background:#3157a4;
  color:white;
  text-align:center;
  padding:45px 20px;
}

section{
  max-width:520px;
  margin:25px auto;
  padding:15px;
}

.box{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 15px #0002;
}

input,
select{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  background:#172a52;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.document-box{
  background:#f5f7ff;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

.notice{
  font-size:13px;
  color:#555;
  line-height:1.5;
}

#message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
  line-height:1.6;
}
</style>
</head>

<body>

<header>
  <h1>ILUMINANTI</h1>
  <p>Leenjii Online Afaan Oromoo</p>
</header>

<div class="hero">
  <h2>Baga Nagaan Dhuftan!</h2>
  <p>
    Baradhu • Dandeettii kee guddifadhu •
    Gara fuulduraatti tarkaanfadhi
  </p>
</div>

<section>

<div class="box">

<h2>📝 Galmee Miseensummaa</h2>

<label>Maqaa Guutuu</label>
<input
  id="name"
  type="text"
  placeholder="Maqaa kee guutuu"
>

<label>Lakkoofsa Bilbilaa</label>
<input
  id="phone"
  type="tel"
  placeholder="09XXXXXXXX"
  maxlength="10"
>

<label>Email</label>
<input
  id="email"
  type="email"
  placeholder="Email kee"
>

<label>Password</label>
<input
  id="password"
  type="password"
  placeholder="Password kee"
>

<div class="document-box">

<h3>🪪 Mirkaneessa Eenyummaa</h3>

<label>Document filadhu</label>

<select id="documentType">

<option value="">
Document filadhu
</option>

<option value="Digital ID">
Digital ID
</option>

<option value="Passport">
Passport
</option>

<option value="Driving Licence">
Driving Licence
</option>

</select>

<p class="notice">
🔒 Odeeffannoon kee mirkaneessaaf qofa fayyada.
Document nama biraa hin fayyadamin.
</p>

</div>

<button id="signup">
  ✅ Miseensa Ta'i
</button>

<button id="login">
  🔐 Seeni
</button>

<p id="message"></p>

</div>

</section>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyC6HhJdYVGkMjmhYTiqjUzYXw8cfXfv7As",

  authDomain:
  "iluminanti-42c47.firebaseapp.com",

  projectId:
  "iluminanti-42c47",

  storageBucket:
  "iluminanti-42c47.firebasestorage.app",

  messagingSenderId:
  "487766650464",

  appId:
  "1:487766650464:web:af9aaf5bcb5bb17e679d05"
};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const message =
document.getElementById("message");


/* =========================
   ACCOUNT UUMUU
========================= */

document.getElementById("signup").onclick =
async function(){

  const name =
  document.getElementById("name")
  .value.trim();

  const phone =
  document.getElementById("phone")
  .value.trim();

  const email =
  document.getElementById("email")
  .value.trim();

  const password =
  document.getElementById("password")
  .value;

  const documentType =
  document.getElementById("documentType")
  .value;


  if(!name){

    message.textContent =
    "⚠️ Mee maqaa kee galchi.";

    return;
  }


  if(!/^09[0-9]{8}$/.test(phone)){

    message.textContent =
    "⚠️ Lakkoofsa bilbilaa sirrii galchi.";

    return;
  }


  if(!email){

    message.textContent =
    "⚠️ Mee email kee galchi.";

    return;
  }


  if(password.length < 6){

    message.textContent =
    "⚠️ Password yoo xiqqaate qubee 6 qabaachuu qaba.";

    return;
  }


  if(!documentType){

    message.textContent =
    "⚠️ Mee Digital ID, Passport ykn Driving Licence filadhu.";

    return;
  }


  try{

    const userCredential =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    const user =
    userCredential.user;


    await setDoc(
      doc(db, "members", user.uid),
      {
        name: name,
        phone: phone,
        email: email,
        documentType: documentType,
        status: "pending",
        createdAt: new Date().toISOString()
      }
    );


    /* ERGAA GALMEE MILKAA'INAA */

    message.textContent =
    "✅ Miseensa ILUMINANTI ta'uuf galmeen kee milkaa'inaan galmaa'eera. " +
    "⏳ Deebii mirkaneessaa eegi.";

  }


  catch(error){

    console.error(error);

    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      message.textContent =
      "⚠️ Email kun duraan account qaba.";

    }

    else{

      message.textContent =
      "❌ Galmee irratti rakkoon uumame.";

    }

  }

};


/* =========================
   LOGIN
========================= */

document.getElementById("login").onclick =
async function(){

  const email =
  document.getElementById("email")
  .value.trim();

  const password =
  document.getElementById("password")
  .value;


  if(!email || !password){

    message.textContent =
    "⚠️ Email fi password galchi.";

    return;
  }


  try{

    const userCredential =
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    const user =
    userCredential.user;


    const memberRef =
    doc(
      db,
      "members",
      user.uid
    );


    const memberSnap =
    await getDoc(memberRef);


    if(!memberSnap.exists()){

      message.textContent =
      "⚠️ Odeeffannoon miseensummaa hin argamne.";

      return;
    }


    const member =
    memberSnap.data();


    /* PENDING */

    if(member.status === "pending"){

      message.textContent =
      "⏳ Galmeen kee ammallee mirkanaa'aa jira. " +
      "Deebii Admin eegi.";

      return;
    }


    /* REJECTED */

    if(member.status === "rejected"){

      message.textContent =
      "❌ Galmeen kee hin mirkanoofne. " +
      "Support qunnami.";

      return;
    }


    /* APPROVED */

    if(member.status === "approved"){

      message.textContent =
      "🎉 Baga gammaddan! Miseensa ILUMINANTI taataniittu.";

      setTimeout(function(){

        window.location.href =
        "dashboard.html";

      },1000);

      return;
    }


    message.textContent =
    "⚠️ Status miseensummaa hin beekamne.";

  }


  catch(error){

    console.error(error);

    message.textContent =
    "❌ Email ykn password sirrii miti.";

  }

};

</script>

</body>
</html>
