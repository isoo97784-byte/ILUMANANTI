<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILUMINANTI Admin Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#172a52;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.container{
  max-width:700px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  padding:22px;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 4px 15px #0002;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.login{
  background:#172a52;
}

.publish{
  background:#168a45;
}

.approve{
  background:#168a45;
}

.reject{
  background:#b3261e;
}

.logout{
  background:#555;
}

.post{
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
  margin-top:15px;
}

.post img{
  width:100%;
  max-height:350px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

.message{
  text-align:center;
  font-weight:bold;
  line-height:1.6;
  word-break:break-word;
}

.hidden{
  display:none;
}

.member{
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
  margin:15px 0;
  background:#fafafa;
}
</style>
</head>

<body>

<header>
<h1>ILUMINANTI</h1>
<p>Admin Dashboard</p>
</header>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<h2>🔐 Admin Login</h2>

<label>Admin Email</label>

<input
id="adminEmail"
type="email"
placeholder="Admin Email">

<label>Admin Password</label>

<input
id="adminPassword"
type="password"
placeholder="Admin Password">

<button
class="login"
id="loginButton">
🔐 Seeni
</button>

<p
id="loginMessage"
class="message">
</p>

</div>


<!-- ADMIN -->

<div
class="hidden"
id="adminPanel">


<!-- POST -->

<div class="card">

<h2>📝 Post Haaraa</h2>

<label>Mata-duree</label>

<input
id="postTitle"
type="text"
placeholder="Mata-duree postii">

<label>Barreeffama</label>

<textarea
id="postContent"
placeholder="Barreeffama postii asitti barreessi"></textarea>

<label>Suuraa</label>

<input
id="postImage"
type="file"
accept="image/*">

<button
class="publish"
id="publishButton">
📢 Publish Post
</button>

<p
id="postMessage"
class="message">
</p>

</div>


<!-- MEMBERS -->

<div class="card">

<h2>👥 Miseensota</h2>

<div id="members">
⏳ Fe'aa jira...
</div>

</div>


<!-- POSTS -->

<div class="card">

<h2>📢 Postoota Maxxanfaman</h2>

<div id="posts">
⏳ Fe'aa jira...
</div>

</div>


<button
class="logout"
id="logoutButton">
🚪 Ba'i
</button>

</div>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  updateDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyC6HhJdYVGkMjmhYTiqjUzYXw8cfXfv7As",

authDomain:
"iluminanti-42c47.firebaseapp.com",

projectId:
"iluminanti-42c47",

storageBucket:
"iluminanti-42c47.firebasestorage.app",

messagingSenderId:
"487766650464",

appId:
"1:487766650464:web:af9aaf5bcb5bb17e679d05"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ADMIN EMAIL */

const ADMIN_EMAIL =
"isoo97784@gmail.com";


/* ELEMENTS */

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginMessage =
document.getElementById("loginMessage");

const members =
document.getElementById("members");

const posts =
document.getElementById("posts");


/* LOGIN */

document.getElementById(
"loginButton"
).addEventListener(
"click",
async function(){

const email =
document.getElementById(
"adminEmail"
).value.trim();

const password =
document.getElementById(
"adminPassword"
).value;


if(!email || !password){

loginMessage.textContent =
"⚠️ Email fi password galchi.";

return;

}


if(email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()){

loginMessage.textContent =
"❌ Email kun admin miti.";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

loginBox.classList.add(
"hidden"
);

adminPanel.classList.remove(
"hidden"
);

loadMembers();
loadPosts();

}

catch(error){

console.error(error);

loginMessage.textContent =
"❌ " +
error.code +
" — " +
error.message;

}

});


/* PUBLISH POST */

document.getElementById(
"publishButton"
).addEventListener(
"click",
async function(){

const title =
document.getElementById(
"postTitle"
).value.trim();

const content =
document.getElementById(
"postContent"
).value.trim();

const imageFile =
document.getElementById(
"postImage"
).files[0];

const message =
document.getElementById(
"postMessage"
);


if(!title){

message.textContent =
"⚠️ Mata-duree galchi.";

return;

}


if(!content){

message.textContent =
"⚠️ Barreeffama galchi.";

return;

}


/*
SUURAA BASE64
Firebase Storage hin fayyadamnu.
Suuraa xiqqaa qofa fayyadami.
*/

let image = "";


if(imageFile){

if(imageFile.size >
800000){

message.textContent =
"⚠️ Suuraan guddaa dha. " +
"Suuraa xiqqaa filadhu.";

return;

}


image =
await fileToBase64(
imageFile
);

}


try{

await addDoc(

collection(
db,
"posts"
),

{

title:title,

content:content,

image:image,

date:new Date()
.toLocaleDateString(
"om-ET"
),

createdAt:
serverTimestamp()

}

);


message.textContent =
"✅ Post milkaa'inaan maxxanfameera.";

document.getElementById(
"postTitle"
).value = "";

document.getElementById(
"postContent"
).value = "";

document.getElementById(
"postImage"
).value = "";

loadPosts();

}

catch(error){

console.error(error);

message.textContent =
"❌ Post maxxansuu hin dandeenye: " +
error.code;

}

});


/* FILE → BASE64 */

function fileToBase64(file){

return new Promise(
function(resolve,reject){

const reader =
new FileReader();

reader.onload =
function(){

resolve(
reader.result
);

};

reader.onerror =
function(){

reject(
reader.error
);

};

reader.readAsDataURL(
file
);

});

}


/* LOAD MEMBERS */

async function loadMembers(){

members.innerHTML =
"⏳ Miseensota fe'aa jira...";


try{

const snapshot =
await getDocs(
collection(
db,
"members"
)
);


if(snapshot.empty){

members.innerHTML =
"📭 Miseensi tokko illee hin jiru.";

return;

}


members.innerHTML = "";


snapshot.forEach(
function(memberDoc){

const data =
memberDoc.data();

const div =
document.createElement(
"div"
);

div.className =
"member";


div.innerHTML = `

<h3>
👤 ${data.name || "-"}
</h3>

<p>
📱 ${data.phone || "-"}
</p>

<p>
📧 ${data.email || "-"}
</p>

<p>
🪪 ${data.documentType || "-"}
</p>

<p>
📌 Status:
<strong>
${data.status || "pending"}
</strong>
</p>

<button
class="approve">
✅ Approve
</button>

<button
class="reject">
❌ Reject
</button>

`;


div.querySelector(
".approve"
).onclick =
function(){

changeStatus(
memberDoc.id,
"approved"
);

};


div.querySelector(
".reject"
).onclick =
function(){

changeStatus(
memberDoc.id,
"rejected"
);

};


members.appendChild(
div
);

});

}

catch(error){

console.error(error);

members.innerHTML =
"❌ Rakkoo database: " +
error.code;

}

}


/* STATUS */

async function changeStatus(
id,
status
){

try{

await updateDoc(

doc(
db,
"members",
id
),

{

status:status

}

);

alert(
"✅ Status jijjiirame."
);

loadMembers();

}

catch(error){

alert(
"❌ " +
error.message
);

}

}


/* LOAD POSTS */

async function loadPosts(){

posts.innerHTML =
"⏳ Postoota fe'aa jira...";


try{

const snapshot =
await getDocs(
collection(
db,
"posts"
)
);


if(snapshot.empty){

posts.innerHTML =
"📭 Post hin jiru.";

return;

}


posts.innerHTML = "";


snapshot.forEach(
function(postDoc){

const data =
postDoc.data();


const div =
document.createElement(
"div"
);

div.className =
"post";


div.innerHTML = `

<h3>
${data.title || ""}
</h3>

<p>
${data.content || ""}
</p>

${
data.image
?
`<img
src="${data.image}"
alt="Post image">`
:
""
}

<p>
📅 ${data.date || ""}
</p>

`;


posts.appendChild(
div
);

});

}

catch(error){

console.error(error);

posts.innerHTML =
"❌ Postoota arguu hin dandeenye.";

}

}


/* LOGOUT */

document.getElementById(
"logoutButton"
).addEventListener(
"click",
async function(){

await signOut(auth);

window.location.reload();

});

</script>

</body>
</html>
