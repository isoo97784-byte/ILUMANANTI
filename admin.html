<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ILUMINANTI - Admin Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#172a52;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.container{
  max-width:700px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  padding:22px;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 4px 15px #0002;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  color:white;
  font-size:16px;
}

.login{
  background:#172a52;
}

.approve{
  background:#168a45;
}

.reject{
  background:#b3261e;
}

.logout{
  background:#555;
}

.member{
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
  margin:15px 0;
  background:#fafafa;
}

.status{
  font-weight:bold;
}

.message{
  text-align:center;
  font-weight:bold;
  line-height:1.6;
  word-break:break-word;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>ILUMINANTI</h1>
  <p>Admin Dashboard</p>
</header>

<div class="container">

  <div class="card" id="loginBox">

    <h2>🔐 Admin Login</h2>

    <label>Admin Email</label>

    <input
      id="adminEmail"
      type="email"
      placeholder="Admin Email"
    >

    <label>Admin Password</label>

    <input
      id="adminPassword"
      type="password"
      placeholder="Admin Password"
    >

    <button
      class="login"
      id="loginButton">
      🔐 Seeni
    </button>

    <p id="loginMessage" class="message"></p>

  </div>


  <div
    class="card hidden"
    id="adminPanel">

    <h2>👥 Miseensota ILUMINANTI</h2>

    <div id="members">
      ⏳ Miseensota fe'aa jira...
    </div>

    <button
      class="logout"
      id="logoutButton">
      🚪 Ba'i
    </button>

  </div>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyC6HhJdYVGkMjmhYTiqjUzYXw8cfXfv7As",

  authDomain:
  "iluminanti-42c47.firebaseapp.com",

  projectId:
  "iluminanti-42c47",

  storageBucket:
  "iluminanti-42c47.firebasestorage.app",

  messagingSenderId:
  "487766650464",

  appId:
  "1:487766650464:web:af9aaf5bcb5bb17e679d05"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* EMAIL ADMIN KEE */

const ADMIN_EMAIL =
"isoo97784@gmail.com";


const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginMessage =
document.getElementById("loginMessage");

const members =
document.getElementById("members");


/* ADMIN LOGIN */

document.getElementById(
"loginButton"
).addEventListener(
"click",
async function(){

  const email =
  document.getElementById(
  "adminEmail"
  ).value.trim();

  const password =
  document.getElementById(
  "adminPassword"
  ).value;


  if(!email || !password){

    loginMessage.textContent =
    "⚠️ Email fi password galchi.";

    return;

  }


  if(email.toLowerCase() !==
     ADMIN_EMAIL.toLowerCase()){

    loginMessage.textContent =
    "❌ Email kun admin miti.";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    loginBox.classList.add(
      "hidden"
    );

    adminPanel.classList.remove(
      "hidden"
    );

    loadMembers();

  }

  catch(error){

    console.error(error);

    loginMessage.textContent =
    "❌ " +
    error.code +
    " — " +
    error.message;

  }

});


/* MEMBERS LOAD */

async function loadMembers(){

  members.innerHTML =
  "⏳ Miseensota fe'aa jira...";


  try{

    const snapshot =
    await getDocs(
      collection(db,"members")
    );


    if(snapshot.empty){

      members.innerHTML =
      "<p>📭 Miseensi tokko illee hin jiru.</p>";

      return;

    }


    members.innerHTML = "";


    snapshot.forEach(function(
      memberDoc
    ){

      const data =
      memberDoc.data();

      const id =
      memberDoc.id;


      const div =
      document.createElement("div");

      div.className =
      "member";


      div.innerHTML = `

        <h3>
        👤 ${data.name || "-"}
        </h3>

        <p>
        📱 Phone:
        ${data.phone || "-"}
        </p>

        <p>
        📧 Email:
        ${data.email || "-"}
        </p>

        <p>
        🪪 Document:
        ${data.documentType || "-"}
        </p>

        <p>
        📄 File:
        ${data.documentFileName || "-"}
        </p>

        <p class="status">
        📌 Status:
        ${data.status || "pending"}
        </p>

        <button
        class="approve">
        ✅ Approve
        </button>

        <button
        class="reject">
        ❌ Reject
        </button>
      `;


      div.querySelector(
        ".approve"
      ).addEventListener(
        "click",
        function(){
          approveMember(id);
        }
      );


      div.querySelector(
        ".reject"
      ).addEventListener(
        "click",
        function(){
          rejectMember(id);
        }
      );


      members.appendChild(div);

    });

  }

  catch(error){

    console.error(error);

    members.innerHTML =
    "<p>❌ Rakkoo database: " +
    error.code +
    "</p>";

  }

}


/* APPROVE */

async function approveMember(id){

  try{

    await updateDoc(

      doc(
        db,
        "members",
        id
      ),

      {
        status:"approved"
      }

    );

    alert(
      "✅ Miseensi approve ta'eera."
    );

    loadMembers();

  }

  catch(error){

    alert(
      "❌ Approve hin milkoofne: " +
      error.message
    );

  }

}


/* REJECT */

async function rejectMember(id){

  try{

    await updateDoc(

      doc(
        db,
        "members",
        id
      ),

      {
        status:"rejected"
      }

    );

    alert(
      "❌ Miseensi rejected ta'eera."
    );

    loadMembers();

  }

  catch(error){

    alert(
      "❌ Reject hin milkoofne: " +
      error.message
    );

  }

}


/* LOGOUT */

document.getElementById(
"logoutButton"
).addEventListener(
"click",
async function(){

  await signOut(auth);

  adminPanel.classList.add(
    "hidden"
  );

  loginBox.classList.remove(
    "hidden"
  );

  document.getElementById(
    "adminPassword"
  ).value = "";

  loginMessage.textContent =
  "Admin ba'eera.";

});

</script>

</body>
</html>
