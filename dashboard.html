<!DOCTYPE html>
<html lang="om">
<head>

  <title>ILUMINANTI Dashboard</title>
  <style>
    body {

      margin: 0;

    header {
      background: #172a52;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;

    .course {
      padding: 18px;
      margin: 12px 0;
      background: #f1f5ff;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #172a52;
      color: white;
      border: 0;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>ILUMINANTI</h1>
  <p>Dashboard Barataa</p>
</header>

<div class="box">

  <h2>🎓 Baga Nagaan Dhuftan!</h2>

  <p>As keessatti koorsiiwwan kee argatta.</p>

  <div class="course">
    <h3>💻 Computer Basics</h3>
    <p>Bu'uura computer baradhu.</p>
    <button>Koorsii Jalqabi</button>
  </div>

  <div class="course">
    <h3>🌐 Digital Skills</h3>
    <p>Dandeettii dijitaalaa baradhu.</p>
    <button>Koorsii Jalqabi</button>
  </div>

  <div class="course">
    <h3>🇬🇧 Afaan Ingilizii</h3>

<script>
function logout() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
